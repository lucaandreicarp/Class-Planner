<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi | Class Planner</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>
    <img src="assets/logo.png" alt="Class Planner" class="logo">

    <form method="get" action="class_planner.php">
        <input type="text" id="class_code" name="code" placeholder="Codice della classe" required>
        <input type="submit" value="Entra">
    </form>

    <p>oppure</p>

    <button type="button" onclick="location.href='create_class.html'">
        Crea classe
    </button>

    <script>
        // Remove code if class gets deleted  
        const params = new URLSearchParams(window.location.search);

        if (params.get("deleted") === "1") {
            localStorage.removeItem("classPlannerCode");
            history.replaceState(null, "", window.location.pathname);
        }

        // Use code if it already exists
        const savedCode = localStorage.getItem("classPlannerCode");

        if (savedCode) {
            document.getElementById("class_code").value = savedCode;
        }
    </script>
</body>
</html>
