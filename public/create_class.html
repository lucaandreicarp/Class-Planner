<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea classe | Class Planner</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/create_class.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <h1>CREA UNA NUOVA CLASSE</h1>

    <form method="post" action="../php/class_data.php" id="form_class">
        <div>
            <label for="name">Classe</label>
            <input type="text" name="name" id="name" placeholder="Nome classe" required>
        </div>

        <div>
            <table id="schedule_table">
                <tr><td>Materie</td><td>Lun</td><td>Mar</td><td>Mer</td><td>Gio</td><td>Ven</td><td>Sab</td></tr>
                <tr>
                    <td><input type="text" name="subjects[subject1]" placeholder="Materia" required></td>
                    <td><input type="checkbox" name="schedule[subject1][1]"></td>
                    <td><input type="checkbox" name="schedule[subject1][2]"></td>
                    <td><input type="checkbox" name="schedule[subject1][3]"></td>
                    <td><input type="checkbox" name="schedule[subject1][4]"></td>
                    <td><input type="checkbox" name="schedule[subject1][5]"></td>
                    <td><input type="checkbox" name="schedule[subject1][6]"></td>
                </tr>
            </table>
            <div class="mobile_buttons">
                <button type="button" id="add_subject">
                    <i data-lucide="plus"></i>
                    <span>Aggiungi materia</span>
                </button>
                <button type="button" id="remove_subject">
                    <i data-lucide="trash-2"></i>
                    <span>Rimuovi materia</span>
                </button>
            </div>
        </div>

        <div>
            <b>Studenti</b>
            <div id="students_container">
                <input type="text" name="students[]" placeholder="Nome studente" required>
            </div>
            <div class="mobile_buttons">
                <button type="button" id="add_student">
                    <i data-lucide="plus"></i>
                    <span>Aggiungi studente</span>
                </button>
                <button type="button" id="remove_student">
                    <i data-lucide="trash-2"></i>
                    <span>Rimuovi studente</span>
                </button>
            </div>
        </div>

        <div id="submit_container">
            <input type="submit" value="Salva classe">
        </div>
    </form>

    <p>oppure</p>

    <button type="button" onclick="location.href='index.html'">
        Ho già una classe
    </button>

    <script src="js/create_class.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
